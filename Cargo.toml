[package]
name = "warden"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
duckdb = { version = "1", features = ["bundled", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
parking_lot = "0.12"
tracing-subscriber = "0.3"
anyhow = "1"
rust-embed = { version = "8", features = ["debug-embed"] }
mime_guess = "2"
# Explicit retry/timeout/cache control for DNS probes — see probe_dns in agent.rs.
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
surge-ping = "0.9"
# Session tokens must be unguessable, and the admin password must be compared
# without leaking its length/prefix through timing.
rand = "0.8"
subtle = "2"
# Custom UP/DOWN eval. Vendored so the build needs no system Lua; the runtime is
# sandboxed in script.rs — this executes user-supplied code.
mlua = { version = "0.9", features = ["lua54", "vendored"] }
# Cron schedules for checks. Six-field (seconds-first) expressions keep
# sub-minute intervals expressible, which a five-field cron cannot do.
cron = "0.12"
# SSL certificate checks: connect, capture the presented chain, read its expiry.
# reqwest already pulls rustls in, so this adds the handshake plumbing only.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
x509-parser = "0.16"
# Agent credentials are hashed before storage, so a leaked database yields no
# working secrets. A single SHA-256 is right here: these are 256-bit random
# secrets, not human passwords, so there is nothing to slow a guesser down for.
sha2 = "0.11"
# Signs admin session tokens so a coordinator cluster can validate a session
# minted by any node without sharing session state — see auth.rs.
hmac = "0.13"
lettre = { version = "0.11.23", default-features = false, features = ["tokio1", "smtp-transport", "builder", "tokio1-rustls-tls"] }
# Immutable check identity: UUIDv7 gives insertion-ordered, collision-proof
# check IDs stored natively as DuckDB UUID columns — see models::CheckId.
uuid = { version = "1", features = ["v7", "v5", "serde"] }
futures-util = "0.3"

[dev-dependencies]
tokio-tungstenite = "0.24"
