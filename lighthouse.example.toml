# Lighthouse bare-metal standalone config example.
# Run directly on the host: lighthouse standalone --config lighthouse.example.toml
# The coordinator listens on the host address below; arrange any firewall, TLS
# termination, and public port mapping outside Lighthouse.
#
# This is the only standalone TOML example. The only two Compose examples
# (`docker-compose.yaml` and `docker-compose.cluster.yaml`) inline their own
# per-service configuration and do not consume this file.
#
# Checks are created through the Admin UI or API and persisted in the
# database; this file does not seed them. A new database starts with no checks.

[agent]
agent_id = "local-01"
flush_secs = 5
# Concurrent probes per agent (default 128). Must be positive; raise it for
# larger agents when their socket, CPU, and network budgets allow.
max_in_flight_probes = 128
# Ignored in standalone. In agent mode this is where results are posted and
# work is polled for. One URL, or a list for failover across the coordinators
# of a region — they are interchangeable for an agent, since config and
# per-agent beliefs both replicate between them:
#   coordinator_url = ["http://coordinator-a:8080", "http://coordinator-b:8080"]

[coordinator]
listen = "0.0.0.0:8080"
db_path = "lighthouse.duckdb"

# Fleet-wide defaults for region-tree alert handling. A check can override any
# of these optional fields below. `min_incident_secs` holds a non-UP rollup
# before opening an incident; `min_recovery_secs` holds an UP rollup before
# resolving it. Zero (the built-in default) means no hold-down.
#
# Degraded notification and downtime are separate: `notify_degraded = true`
# (the default) sends a Degraded transition to the check's notifiers, while
# `degraded_is_downtime = false` (the default) keeps Degraded out of incident
# downtime accounting. Set the latter only when partial outages are downtime
# for this check.
[coordinator.rollup_defaults]
min_incident_secs = 60
min_recovery_secs = 30
notify_degraded = true
degraded_is_downtime = false

# Notification backends. These only seed the store on first boot — after
# that they are edited in Admin > Notifications. A check with no
# `notifiers` of its own goes to every one marked `default = true`.
#
# [[coordinator.notifiers]]
# name = "oncall"
# default = true
# type = "webhook"            # POSTs {check_id, from, to}
# url = "https://hooks.example.com/..."
#
# type = "slack"              # a Slack incoming webhook wants `text`, so it is
# webhook_url = "https://hooks.slack.com/services/..."   # not the webhook kind
#
# type = "ntfy"
# topic = "lighthouse"
# base_url = "https://ntfy.sh"  # optional
#
# type = "pagerduty"          # Events API v2. The check id is the dedup key, so
# routing_key = "..."         # a recovery resolves the incident it opened.
#
# type = "email"
# host = "smtp.example.com"
# port = 587                  # optional: 465 implicit, 587 starttls, 25 none
# tls = "starttls"            # starttls (default) | implicit | none
# username = "lighthouse"         # both or neither
# password = "..."            # better supplied in the admin UI than this file
# from = "lighthouse@example.com"
# to = "ops@example.com"      # one address; use an alias for a list

# Secrets are better supplied by the environment than written here — this file
# tends to end up in version control. All three fall back to an env var:
#
#   LIGHTHOUSE_ADMIN_PASSWORD  unlocks the check editor. With neither this nor the
#                          env var set, the editor is disabled rather than open.
#   LIGHTHOUSE_PEER_TOKEN      coordinator-to-coordinator authentication for both
#                          membership and replication. Only needed when
#                          `peers` is set. Unset means every peer message is
#                          refused with 401.
#   LIGHTHOUSE_ADVERTISE_URL   see below.
#
# Agents are not authenticated by anything in this file. Each zone gets a
# credential minted in Admin > Credentials, and a coordinator with none refuses
# every agent request until one exists — there is no shared token and no open
# mode.
#
# admin_password = "change-me"
# Set only when clients reach this server through HTTPS (including a TLS
# terminator you trust). Lighthouse never trusts Forwarded/X-Forwarded-Proto from a
# request to decide this, because clients can forge those headers.
# secure_cookies = true

# Reverse proxies allowed to supply X-Forwarded-For, as bare IPs or CIDRs.
# Empty (the default) means login rate limiting keys on the raw connecting
# socket, so every client behind an undeclared proxy shares one bucket — and
# the header is never read, so a client cannot forge its way out of that
# bucket either. Set this to the proxy's own address(es), not the clients',
# when you need rate limiting to key on the real client IP instead.
# trusted_proxies = ["10.0.0.0/8"]

# Regional clustering. Irrelevant to a standalone install — `peers` empty (the
# default) is what makes it standalone — so everything below is commented out.
# Setting `peers` turns on membership, replication and anti-entropy against
# the coordinators named there; see §9 Clustering in uptime-monitor-design.md.
#
# peers = ["http://coordinator-b:8080", "http://coordinator-c:8080"]
#
# Stable identity of this node in the cluster. Unset means one is generated on
# first boot and persisted, so a restart rejoins as itself rather than
# appearing as a new member and leaving a ghost behind. Env: LIGHTHOUSE_NODE_ID.
# node_id = "coordinator-a"
#
# How peers reach *this* node. Required once `peers` is non-empty — startup
# refuses to run without it, because a node no peer can dial back replicates
# outward while receiving nothing. Env: LIGHTHOUSE_ADVERTISE_URL.
# advertise_url = "http://coordinator-a:8080"
#
# How often every known member is pinged. Also the granularity of failure
# detection: nothing is noticed faster than this.
# gossip_interval_secs = 5
#
# Silence after which a member is suspected, and twice which it is declared
# dead. Comfortably above gossip_interval_secs, or one dropped ping suspects a
# healthy peer.
# peer_timeout_secs = 15
#
# How often to reconcile with a peer by digest exchange. Bounds how long a
# divergence from a dropped replication push can last; it is a correctness
# backstop, not the main replication path.
# anti_entropy_secs = 60
#
# Which region this coordinator belongs to. Only used to label the state
# summaries it pushes to a global coordinator (Stage B / Phase 6). A
# single-region deployment can leave it at "default".
# region = "us-east"

# Push this coordinator's state summary up to a global coordinator (Phase 6).
# Presence of this block is what turns the push loop on; without it the node
# behaves exactly as a Stage A regional coordinator. Every coordinator in a
# region cluster may push — the global node keeps last-writer-wins, so three
# identical pushes collapse to one cached entry.
#
# [coordinator.global]
# url = "http://global:8080"           # base URL of the global coordinator
# token_env = "LIGHTHOUSE_GLOBAL_TOKEN"    # or: token = "..."; the global node's secret
# push_secs = 5                        # 5-10s; default 5

# Placement chooses probes by failure domain with rendezvous hashing: if a
# selected agent disappears, the next-ranked live agent in that domain takes
# over without reshuffling unrelated checks. The default is one probe per zone
# (`mode = "zone"`, `count = 1`); the historical `per_zone = 1` remains
# accepted with that meaning. Explicit `mode = "region"`, `count = 1` chooses
# one probe per region across its zones. `count` is per selected domain, never
# fleet-wide. Both `regions` and `zones` are optional allow-lists, set when
# creating or editing a check through the Admin UI or API.

# --- Global coordinator (`lighthouse global`) -----------------------------------
# Only read in `global` mode. The global node caches the state summaries the
# regions push, serves an aggregated dashboard, and proxies drill-down reads
# back to the owning region. It holds no raw data and probes nothing.
#
# [global]
# listen = "0.0.0.0:8080"
# token_env = "LIGHTHOUSE_GLOBAL_TOKEN"    # required: the shared push secret
# region_staleness_secs = 20           # a region silent this long reads as dark
#
# Cross-region alerting. Empty (the default) means the global node never pages:
# the regions already alert, and double-paging is the failure mode to avoid.
# Configured, it fires only on what a single region cannot see — a check down in
# every reporting region, or a region going dark. Same notifier shapes as
# [[coordinator.notifiers]].
# [[global.notifiers]]
# name = "global-webhook"
# type = "webhook"
# url = "https://example.com/hook"
#
# Seed the query-routing table so drill-downs work before the first push and
# after a restart. Endpoints are also learned from each push's advertise_url.
# [[global.region]]
# name = "us"
# endpoints = ["http://coordinator-us-a:8080", "http://coordinator-us-b:8080"]
# [[global.region]]
# name = "tw"
# endpoints = ["http://coordinator-tw:8080"]

# Agent credentials whose token is chosen in advance instead of minted in the
# UI. Use this when bare-metal agents must be configured before this coordinator
# has ever run and no browser is available to mint credentials. The two Compose
# files instead inline their own provisioned credentials and agent configs.
# Everything else about them is identical to a minted credential, zone and
# region included: the coordinator takes an agent's location from here, never
# from what the agent claims.
#
# Use `token_env` outside a fixture and keep the secret out of this file. An
# unresolvable or malformed token stops startup rather than being skipped: the
# alternative is a fleet authenticating against nothing, which looks exactly
# like a fleet that has not been given work yet.
#
# Applied once. A credential whose id already exists is left untouched, so this
# block neither rewrites the row (and pushes a config change to every peer) on
# each restart, nor resurrects a credential someone revoked. Revoking one and
# leaving the block here is fine and is the intended way to retire it.
#
# In a cluster, declare the blocks on one node only — the others receive the
# credentials over the config plane, which is the whole point of minting once
# for the fleet rather than once per coordinator.
#
# [[coordinator.provision]]
# zone = "us-east-1a"
# region = "us-east"
# token_env = "LIGHTHOUSE_AGENT_TOKEN_A"    # or: token = "wac_....." (fixtures)

# --- Checks -------------------------------------------------------------
# Checks (HTTP, TCP, DNS, ICMP, ...) are created through the Admin UI or the
# API, not this file. Once created they are persisted in the database and
# survive restarts; this file has no equivalent [[checks]] section.