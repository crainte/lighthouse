# Pinned so CI and local builds agree. Newer stable releases add deprecations
# that `clippy -D warnings` turns into failures; bump this deliberately.
# 1.99.1 is the channel the other omusubiya repos pin, so every repo in the org
# builds on one Rust version.
[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
