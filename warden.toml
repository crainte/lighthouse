# Warden live config. Edit this file, then restart the container:
#   docker restart warden
#
# Run mode matters:
#   standalone  = runs the checks AND serves the dashboard  <-- what you want on one box
#   agent       = runs checks only, POSTs to a remote coordinator
#   coordinator = serves the dashboard and ingests only, RUNS NO CHECKS
#
# Configuring any [[checks]] disables the demo seed data.

[agent]
agent_id = "local-01"
flush_secs = 5

[coordinator]
# 8080 is taken by AdGuard on this host, so serve on 8082 to match the old URL.
listen = "0.0.0.0:8082"
db_path = "/data/db/warden.duckdb"
# alert_webhook = "https://hooks.slack.com/services/..."

# ---------------------------------------------------------------------------
# Local services. These assume --network host so 127.0.0.1 is the real host.
# ---------------------------------------------------------------------------

[[checks]]
name = "adguard"
type = "http"
target = "http://127.0.0.1:8080/"
interval_secs = 60
timeout_secs = 10

[[checks]]
name = "bifrost-api"
type = "http"
target = "http://127.0.0.1:8081/"
interval_secs = 60
timeout_secs = 10

[[checks]]
name = "hindsight"
type = "http"
target = "http://127.0.0.1:8888/"
interval_secs = 60
timeout_secs = 10

# Raw port check — no HTTP needed.
[[checks]]
name = "bifrost-dns-tcp"
type = "tcp"
target = "127.0.0.1:1053"
interval_secs = 60
timeout_secs = 5

# ---------------------------------------------------------------------------
# External reachability.
# ---------------------------------------------------------------------------

[[checks]]
name = "internet-dns"
type = "dns"
target = "example.com"
interval_secs = 60
timeout_secs = 10

[[checks]]
name = "internet-icmp"
type = "icmp"
target = "1.1.1.1"
interval_secs = 60
timeout_secs = 5

