# Stage B / Phase 6 demo: two regions behind a three-node global tier.
#
#   region   UI / coordinator   agents                zone           port
#   us       coordinator-us-a   agent-us-1, agent-us-2 us-west-1a    :9001
#            coordinator-us-b                                        :9002
#            coordinator-us-c   agent-us-3             us-east-1a     :9003
#   tw       coordinator-tw     agent-tw               tw-north-1a    :9004
#   (global) global-a           — aggregates us + tw —                :9005
#            global-b                                                :9006
#            global-c                                                :9007
#
# The us region is a 3-node coordinator cluster (seed chain a -> b -> c -> a);
# tw is a single coordinator. The global tier is likewise three nodes
# (SCALING.md "Placement-scoped configuration", Phase 4), seeded a -> b -> c
# -> a the same way. The us region pushes its state summary to global-a and
# the tw region to global-b, on purpose: a region's push is ephemeral
# per-region *data* held in the receiving node's memory, and the receiver
# forwards each push it applied to its peer global nodes
# (`global::state_fanout`), so all three serve the same dashboard whichever
# node a region dialled. The *catalogue* (checks and sections) is durable,
# in `/data/lighthouse.duckdb` on each, distributed to every region
# (`global::store`/`global::reconcile`) and replicated between the three over
# their own peer cluster (`global::cluster`). The durable global alert firing
# set rides the same plane, and a global node only serves as ready
# (`/readyz`) and owns alerting once it is in sync with its peers
# (`global::sync`). A production deployment puts a load balancer that honours
# `/readyz` in front of all three for the browser, and points every region's
# `[coordinator.global]` at an address that reaches any node, ready or not.
#
# Regions are not declared on the global tier. Each holds its own
# registration key (`wac_<id>.<secret>`, bound to its region name); the global
# nodes provision both keys once at first boot, and a region attaches itself on
# its first authenticated push. Further regions are registered in the global
# Admin > Cluster > Regions, which mints a key, without touching this file.
#
# Required env (no committed defaults):
#   LIGHTHOUSE_PEER_TOKEN        shared by the us coordinator cluster
#   LIGHTHOUSE_REGION_KEY_US     us registration key (the us coordinators, global)
#   LIGHTHOUSE_REGION_KEY_TW     tw registration key (coordinator-tw, global)
#   LIGHTHOUSE_GLOBAL_PEER_TOKEN shared by the three global nodes' own cluster
#   LIGHTHOUSE_AGENT_TOKEN_W     the two us-west agents
#   LIGHTHOUSE_AGENT_TOKEN_E     the one us-east agent
#   LIGHTHOUSE_AGENT_TOKEN_TW    the tw agent
#   LIGHTHOUSE_ADMIN_PASSWORD    optional; the admin UI is read-only without it
#
# Preview: open http://localhost:9005 for the global dashboard once the stack
# is up (cold start ~55s); :9006 and :9007 serve the same dashboard. The
# regional dashboards remain on :9001-:9004.

name: lighthouse-global

x-coordinator-env: &coordinator-env
  LIGHTHOUSE_ADMIN_PASSWORD: ${LIGHTHOUSE_ADMIN_PASSWORD:-}
  LIGHTHOUSE_PEER_TOKEN: ${LIGHTHOUSE_PEER_TOKEN:?LIGHTHOUSE_PEER_TOKEN is required}
  LIGHTHOUSE_AGENT_TOKEN_W: ${LIGHTHOUSE_AGENT_TOKEN_W:?LIGHTHOUSE_AGENT_TOKEN_W is required}
  LIGHTHOUSE_AGENT_TOKEN_E: ${LIGHTHOUSE_AGENT_TOKEN_E:?LIGHTHOUSE_AGENT_TOKEN_E is required}
  LIGHTHOUSE_AGENT_TOKEN_TW: ${LIGHTHOUSE_AGENT_TOKEN_TW:?LIGHTHOUSE_AGENT_TOKEN_TW is required}

# Each region's coordinators see only that region's key.
x-us-env: &us-env
  <<: *coordinator-env
  LIGHTHOUSE_REGION_KEY: ${LIGHTHOUSE_REGION_KEY_US:?LIGHTHOUSE_REGION_KEY_US is required}

x-coordinator: &coordinator
  build:
    context: .
    args:
      GIT_SHA: ${GIT_SHA:-}
  image: lighthouse:latest
  command: ["coordinator"]
  environment: *us-env
  restart: unless-stopped
  networks:
    - lighthouse

x-global: &global
  build:
    context: .
    args:
      GIT_SHA: ${GIT_SHA:-}
  image: lighthouse:latest
  command: ["global"]
  environment:
    LIGHTHOUSE_ADMIN_PASSWORD: ${LIGHTHOUSE_ADMIN_PASSWORD:-}
    # Provisioned once at first boot ([[global.provision]]); stored hashed.
    LIGHTHOUSE_REGION_KEY_US: ${LIGHTHOUSE_REGION_KEY_US:?LIGHTHOUSE_REGION_KEY_US is required}
    LIGHTHOUSE_REGION_KEY_TW: ${LIGHTHOUSE_REGION_KEY_TW:?LIGHTHOUSE_REGION_KEY_TW is required}
    # This global node's own cluster secret (Phase 4) — distinct from the
    # region registration keys above, which regions present. Named
    # LIGHTHOUSE_PEER_TOKEN inside the container because `GlobalConfig` resolves
    # its peer token from that variable, the same one a coordinator's own
    # cluster uses; the compose-level name is kept separate
    # (LIGHTHOUSE_GLOBAL_PEER_TOKEN) so the two secrets are never accidentally
    # set to the same value.
    LIGHTHOUSE_PEER_TOKEN: ${LIGHTHOUSE_GLOBAL_PEER_TOKEN:?LIGHTHOUSE_GLOBAL_PEER_TOKEN is required}
  restart: unless-stopped
  networks:
    - lighthouse

x-agent: &agent
  build:
    context: .
    args:
      GIT_SHA: ${GIT_SHA:-}
  image: lighthouse:latest
  command: ["agent"]
  cap_add:
    - NET_RAW
  restart: unless-stopped
  networks:
    - lighthouse

services:
  # ---- US region: 3-node cluster ----
  coordinator-us-a:
    <<: *coordinator
    ports:
      - "${LIGHTHOUSE_PORT_US_A:-9001}:8080"
    configs:
      - source: coordinator-us-a-toml
        target: /data/lighthouse.toml
    volumes:
      - coordinator-us-a-data:/data

  coordinator-us-b:
    <<: *coordinator
    ports:
      - "${LIGHTHOUSE_PORT_US_B:-9002}:8080"
    configs:
      - source: coordinator-us-b-toml
        target: /data/lighthouse.toml
    volumes:
      - coordinator-us-b-data:/data

  coordinator-us-c:
    <<: *coordinator
    ports:
      - "${LIGHTHOUSE_PORT_US_C:-9003}:8080"
    configs:
      - source: coordinator-us-c-toml
        target: /data/lighthouse.toml
    volumes:
      - coordinator-us-c-data:/data

  # ---- Taiwan region: single coordinator ----
  coordinator-tw:
    <<: *coordinator
    environment:
      <<: *coordinator-env
      LIGHTHOUSE_REGION_KEY: ${LIGHTHOUSE_REGION_KEY_TW:?LIGHTHOUSE_REGION_KEY_TW is required}
    ports:
      - "${LIGHTHOUSE_PORT_TW:-9004}:8080"
    configs:
      - source: coordinator-tw-toml
        target: /data/lighthouse.toml
    volumes:
      - coordinator-tw-data:/data

  # ---- Global tier: 3-node cluster (Phase 4), each with its own durable
  #      catalogue (Phase 1). ----
  global-a:
    <<: *global
    ports:
      - "${LIGHTHOUSE_PORT_GLOBAL:-9005}:8080"
    configs:
      - source: global-a-toml
        target: /data/lighthouse.toml
    volumes:
      - global-a-data:/data

  global-b:
    <<: *global
    ports:
      - "${LIGHTHOUSE_PORT_GLOBAL_B:-9006}:8080"
    configs:
      - source: global-b-toml
        target: /data/lighthouse.toml
    volumes:
      - global-b-data:/data

  global-c:
    <<: *global
    ports:
      - "${LIGHTHOUSE_PORT_GLOBAL_C:-9007}:8080"
    configs:
      - source: global-c-toml
        target: /data/lighthouse.toml
    volumes:
      - global-c-data:/data

  # ---- US agents ----
  agent-us-1:
    <<: *agent
    environment:
      LIGHTHOUSE_AGENT_TOKEN: ${LIGHTHOUSE_AGENT_TOKEN_W:?LIGHTHOUSE_AGENT_TOKEN_W is required}
    configs:
      - source: agent-us-1-toml
        target: /data/lighthouse.toml

  agent-us-2:
    <<: *agent
    environment:
      LIGHTHOUSE_AGENT_TOKEN: ${LIGHTHOUSE_AGENT_TOKEN_W:?LIGHTHOUSE_AGENT_TOKEN_W is required}
    configs:
      - source: agent-us-2-toml
        target: /data/lighthouse.toml

  agent-us-3:
    <<: *agent
    environment:
      LIGHTHOUSE_AGENT_TOKEN: ${LIGHTHOUSE_AGENT_TOKEN_E:?LIGHTHOUSE_AGENT_TOKEN_E is required}
    configs:
      - source: agent-us-3-toml
        target: /data/lighthouse.toml

  # ---- Taiwan agent ----
  agent-tw:
    <<: *agent
    environment:
      LIGHTHOUSE_AGENT_TOKEN: ${LIGHTHOUSE_AGENT_TOKEN_TW:?LIGHTHOUSE_AGENT_TOKEN_TW is required}
    configs:
      - source: agent-tw-toml
        target: /data/lighthouse.toml

configs:
  # ---- US coordinators. All three share region "us", push to the global node,
  #      and provision the two us zones' agent credentials. Checks are created
  #      through the Admin UI or API and persisted in the database; the config
  #      plane replicates them from coordinator-a to b and c. ----
  coordinator-us-a-toml:
    content: |
      [coordinator]
      listen = "0.0.0.0:8080"
      db_path = "/data/lighthouse.duckdb"
      node_id = "coordinator-us-a"
      region = "us"
      advertise_url = "http://coordinator-us-a:8080"
      peers = ["http://coordinator-us-b:8080"]
      gossip_interval_secs = 5
      peer_timeout_secs = 15
      anti_entropy_secs = 60

      [coordinator.global]
      url = "http://global-a:8080"
      token_env = "LIGHTHOUSE_REGION_KEY"
      push_secs = 5

      [[coordinator.provision]]
      zone = "us-west-1a"
      region = "us"
      token_env = "LIGHTHOUSE_AGENT_TOKEN_W"

      [[coordinator.provision]]
      zone = "us-east-1a"
      region = "us"
      token_env = "LIGHTHOUSE_AGENT_TOKEN_E"

      # Checks are created through the Admin UI or API and persisted in the
      # database; none are seeded from this file.

  coordinator-us-b-toml:
    content: |
      [coordinator]
      listen = "0.0.0.0:8080"
      db_path = "/data/lighthouse.duckdb"
      node_id = "coordinator-us-b"
      region = "us"
      advertise_url = "http://coordinator-us-b:8080"
      peers = ["http://coordinator-us-c:8080"]
      gossip_interval_secs = 5
      peer_timeout_secs = 15
      anti_entropy_secs = 60

      [coordinator.global]
      url = "http://global-a:8080"
      token_env = "LIGHTHOUSE_REGION_KEY"
      push_secs = 5

      [[coordinator.provision]]
      zone = "us-west-1a"
      region = "us"
      token_env = "LIGHTHOUSE_AGENT_TOKEN_W"

      [[coordinator.provision]]
      zone = "us-east-1a"
      region = "us"
      token_env = "LIGHTHOUSE_AGENT_TOKEN_E"

  coordinator-us-c-toml:
    content: |
      [coordinator]
      listen = "0.0.0.0:8080"
      db_path = "/data/lighthouse.duckdb"
      node_id = "coordinator-us-c"
      region = "us"
      advertise_url = "http://coordinator-us-c:8080"
      peers = ["http://coordinator-us-a:8080"]
      gossip_interval_secs = 5
      peer_timeout_secs = 15
      anti_entropy_secs = 60

      [coordinator.global]
      url = "http://global-a:8080"
      token_env = "LIGHTHOUSE_REGION_KEY"
      push_secs = 5

      [[coordinator.provision]]
      zone = "us-west-1a"
      region = "us"
      token_env = "LIGHTHOUSE_AGENT_TOKEN_W"

      [[coordinator.provision]]
      zone = "us-east-1a"
      region = "us"
      token_env = "LIGHTHOUSE_AGENT_TOKEN_E"

  # ---- Taiwan coordinator: single node in region "tw". ----
  coordinator-tw-toml:
    content: |
      [coordinator]
      listen = "0.0.0.0:8080"
      db_path = "/data/lighthouse.duckdb"
      node_id = "coordinator-tw"
      region = "tw"
      # Pushed with each state summary: how the global tier reaches this region.
      advertise_url = "http://coordinator-tw:8080"

      [coordinator.rollup_defaults]
      min_incident_secs = 60

      [coordinator.global]
      # global-b, not global-a: exercises global-to-global state forwarding.
      url = "http://global-b:8080"
      token_env = "LIGHTHOUSE_REGION_KEY"
      push_secs = 5

      [[coordinator.provision]]
      zone = "tw-north-1a"
      region = "tw"
      token_env = "LIGHTHOUSE_AGENT_TOKEN_TW"

      # Checks are created through the Admin UI or API and persisted in the
      # database; none are seeded from this file.

  # ---- Global tier: 3 nodes, seeded a -> b -> c -> a like the us
  #      coordinators. Each holds the whole catalogue durably and reconciles
  #      it with the other two (Phase 4) and with every region (Phase 1); none
  #      of the three holds raw results. Regions push to global-a (us) and
  #      global-b (tw); received state is forwarded to the others — see the
  #      file header. ----
  global-a-toml:
    content: |
      [global]
      listen = "0.0.0.0:8080"
      db_path = "/data/lighthouse.duckdb"
      region_staleness_secs = 30
      node_id = "global-a"
      advertise_url = "http://global-a:8080"
      peers = ["http://global-b:8080"]
      gossip_interval_secs = 5
      peer_timeout_secs = 15
      anti_entropy_secs = 30

      [[global.provision]]
      region = "us"
      token_env = "LIGHTHOUSE_REGION_KEY_US"

      [[global.provision]]
      region = "tw"
      token_env = "LIGHTHOUSE_REGION_KEY_TW"

  global-b-toml:
    content: |
      [global]
      listen = "0.0.0.0:8080"
      db_path = "/data/lighthouse.duckdb"
      region_staleness_secs = 30
      node_id = "global-b"
      advertise_url = "http://global-b:8080"
      peers = ["http://global-c:8080"]
      gossip_interval_secs = 5
      peer_timeout_secs = 15
      anti_entropy_secs = 30

      [[global.provision]]
      region = "us"
      token_env = "LIGHTHOUSE_REGION_KEY_US"

      [[global.provision]]
      region = "tw"
      token_env = "LIGHTHOUSE_REGION_KEY_TW"

  global-c-toml:
    content: |
      [global]
      listen = "0.0.0.0:8080"
      db_path = "/data/lighthouse.duckdb"
      region_staleness_secs = 30
      node_id = "global-c"
      advertise_url = "http://global-c:8080"
      peers = ["http://global-a:8080"]
      gossip_interval_secs = 5
      peer_timeout_secs = 15
      anti_entropy_secs = 30

      [[global.provision]]
      region = "us"
      token_env = "LIGHTHOUSE_REGION_KEY_US"

      [[global.provision]]
      region = "tw"
      token_env = "LIGHTHOUSE_REGION_KEY_TW"

  # ---- Agents. Each region's agents fail over across that region's
  #      coordinators; the tw agent has only one. ----
  agent-us-1-toml:
    content: |
      [agent]
      coordinator_url = ["http://coordinator-us-a:8080", "http://coordinator-us-b:8080", "http://coordinator-us-c:8080"]
      agent_id = "agent-us-1"
      flush_secs = 5

  agent-us-2-toml:
    content: |
      [agent]
      coordinator_url = ["http://coordinator-us-b:8080", "http://coordinator-us-c:8080", "http://coordinator-us-a:8080"]
      agent_id = "agent-us-2"
      flush_secs = 5

  agent-us-3-toml:
    content: |
      [agent]
      coordinator_url = ["http://coordinator-us-c:8080", "http://coordinator-us-a:8080", "http://coordinator-us-b:8080"]
      agent_id = "agent-us-3"
      flush_secs = 5

  agent-tw-toml:
    content: |
      [agent]
      coordinator_url = ["http://coordinator-tw:8080"]
      agent_id = "agent-tw"
      flush_secs = 5

volumes:
  coordinator-us-a-data:
  coordinator-us-b-data:
  coordinator-us-c-data:
  coordinator-tw-data:
  global-a-data:
  global-b-data:
  global-c-data:

networks:
  lighthouse: