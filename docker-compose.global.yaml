# Stage B / Phase 6 demo: two regions behind one global coordinator.
#
#   region   UI / coordinator   agents                zone           port
#   us       coordinator-us-a   agent-us-1, agent-us-2 us-west-1a    :9001
#            coordinator-us-b                                        :9002
#            coordinator-us-c   agent-us-3            us-east-1a     :9003
#   tw       coordinator-tw     agent-tw             tw-north-1a    :9004
#   (global) global             — aggregates us + tw —              :9005
#
# The us region is a 3-node cluster (seed chain a -> b -> c -> a); tw is a
# single coordinator. Both regions push their state summary to `global`, which
# holds no raw data: it caches the summaries, serves an aggregated dashboard on
# :9005, and proxies drill-down reads back to the owning region.
#
# Required env (no committed defaults):
#   WARDEN_PEER_TOKEN        shared by the us cluster
#   WARDEN_GLOBAL_TOKEN      shared by every coordinator and the global node
#   WARDEN_AGENT_TOKEN_W     the two us-west agents
#   WARDEN_AGENT_TOKEN_E     the one us-east agent
#   WARDEN_AGENT_TOKEN_TW    the tw agent
#   WARDEN_ADMIN_PASSWORD    optional; the admin UI is read-only without it
#
# Preview: open http://localhost:9005 for the global dashboard once the stack
# is up (cold start ~55s). The regional dashboards remain on :9001-:9004.

name: warden-global

x-coordinator: &coordinator
  build:
    context: .
    args:
      GIT_SHA: ${GIT_SHA:-}
  image: warden:latest
  command: ["coordinator"]
  environment:
    WARDEN_ADMIN_PASSWORD: ${WARDEN_ADMIN_PASSWORD:-}
    WARDEN_PEER_TOKEN: ${WARDEN_PEER_TOKEN:?WARDEN_PEER_TOKEN is required}
    WARDEN_GLOBAL_TOKEN: ${WARDEN_GLOBAL_TOKEN:?WARDEN_GLOBAL_TOKEN is required}
    WARDEN_AGENT_TOKEN_W: ${WARDEN_AGENT_TOKEN_W:?WARDEN_AGENT_TOKEN_W is required}
    WARDEN_AGENT_TOKEN_E: ${WARDEN_AGENT_TOKEN_E:?WARDEN_AGENT_TOKEN_E is required}
    WARDEN_AGENT_TOKEN_TW: ${WARDEN_AGENT_TOKEN_TW:?WARDEN_AGENT_TOKEN_TW is required}
  restart: unless-stopped
  networks:
    - warden

x-agent: &agent
  build:
    context: .
    args:
      GIT_SHA: ${GIT_SHA:-}
  image: warden:latest
  command: ["agent"]
  cap_add:
    - NET_RAW
  restart: unless-stopped
  networks:
    - warden

services:
  # ---- US region: 3-node cluster ----
  coordinator-us-a:
    <<: *coordinator
    ports:
      - "${WARDEN_PORT_US_A:-9001}:8080"
    configs:
      - source: coordinator-us-a-toml
        target: /data/warden.toml
    volumes:
      - coordinator-us-a-data:/data

  coordinator-us-b:
    <<: *coordinator
    ports:
      - "${WARDEN_PORT_US_B:-9002}:8080"
    configs:
      - source: coordinator-us-b-toml
        target: /data/warden.toml
    volumes:
      - coordinator-us-b-data:/data

  coordinator-us-c:
    <<: *coordinator
    ports:
      - "${WARDEN_PORT_US_C:-9003}:8080"
    configs:
      - source: coordinator-us-c-toml
        target: /data/warden.toml
    volumes:
      - coordinator-us-c-data:/data

  # ---- Taiwan region: single coordinator ----
  coordinator-tw:
    <<: *coordinator
    ports:
      - "${WARDEN_PORT_TW:-9004}:8080"
    configs:
      - source: coordinator-tw-toml
        target: /data/warden.toml
    volumes:
      - coordinator-tw-data:/data

  # ---- Global coordinator ----
  global:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: warden:latest
    command: ["global"]
    ports:
      - "${WARDEN_PORT_GLOBAL:-9005}:8080"
    environment:
      WARDEN_ADMIN_PASSWORD: ${WARDEN_ADMIN_PASSWORD:-}
      WARDEN_GLOBAL_TOKEN: ${WARDEN_GLOBAL_TOKEN:?WARDEN_GLOBAL_TOKEN is required}
    configs:
      - source: global-toml
        target: /data/warden.toml
    restart: unless-stopped
    networks:
      - warden

  # ---- US agents ----
  agent-us-1:
    <<: *agent
    environment:
      WARDEN_AGENT_TOKEN: ${WARDEN_AGENT_TOKEN_W:?WARDEN_AGENT_TOKEN_W is required}
    configs:
      - source: agent-us-1-toml
        target: /data/warden.toml

  agent-us-2:
    <<: *agent
    environment:
      WARDEN_AGENT_TOKEN: ${WARDEN_AGENT_TOKEN_W:?WARDEN_AGENT_TOKEN_W is required}
    configs:
      - source: agent-us-2-toml
        target: /data/warden.toml

  agent-us-3:
    <<: *agent
    environment:
      WARDEN_AGENT_TOKEN: ${WARDEN_AGENT_TOKEN_E:?WARDEN_AGENT_TOKEN_E is required}
    configs:
      - source: agent-us-3-toml
        target: /data/warden.toml

  # ---- Taiwan agent ----
  agent-tw:
    <<: *agent
    environment:
      WARDEN_AGENT_TOKEN: ${WARDEN_AGENT_TOKEN_TW:?WARDEN_AGENT_TOKEN_TW is required}
    configs:
      - source: agent-tw-toml
        target: /data/warden.toml

configs:
  # ---- US coordinators. All three share region "us", push to the global node,
  #      and provision the two us zones' agent credentials. Checks are created
  #      through the Admin UI or API and persisted in the database; the config
  #      plane replicates them from coordinator-a to b and c. ----
  coordinator-us-a-toml:
    content: |
      [coordinator]
      listen = "0.0.0.0:8080"
      db_path = "/data/warden.duckdb"
      node_id = "coordinator-us-a"
      region = "us"
      advertise_url = "http://coordinator-us-a:8080"
      peers = ["http://coordinator-us-b:8080"]
      gossip_interval_secs = 5
      peer_timeout_secs = 15
      anti_entropy_secs = 60

      [coordinator.global]
      url = "http://global:8080"
      token_env = "WARDEN_GLOBAL_TOKEN"
      push_secs = 5

      [[coordinator.provision]]
      zone = "us-west-1a"
      region = "us"
      token_env = "WARDEN_AGENT_TOKEN_W"

      [[coordinator.provision]]
      zone = "us-east-1a"
      region = "us"
      token_env = "WARDEN_AGENT_TOKEN_E"

      # Checks are created through the Admin UI or API and persisted in the
      # database; none are seeded from this file.

  coordinator-us-b-toml:
    content: |
      [coordinator]
      listen = "0.0.0.0:8080"
      db_path = "/data/warden.duckdb"
      node_id = "coordinator-us-b"
      region = "us"
      advertise_url = "http://coordinator-us-b:8080"
      peers = ["http://coordinator-us-c:8080"]
      gossip_interval_secs = 5
      peer_timeout_secs = 15
      anti_entropy_secs = 60

      [coordinator.global]
      url = "http://global:8080"
      token_env = "WARDEN_GLOBAL_TOKEN"
      push_secs = 5

      [[coordinator.provision]]
      zone = "us-west-1a"
      region = "us"
      token_env = "WARDEN_AGENT_TOKEN_W"

      [[coordinator.provision]]
      zone = "us-east-1a"
      region = "us"
      token_env = "WARDEN_AGENT_TOKEN_E"

  coordinator-us-c-toml:
    content: |
      [coordinator]
      listen = "0.0.0.0:8080"
      db_path = "/data/warden.duckdb"
      node_id = "coordinator-us-c"
      region = "us"
      advertise_url = "http://coordinator-us-c:8080"
      peers = ["http://coordinator-us-a:8080"]
      gossip_interval_secs = 5
      peer_timeout_secs = 15
      anti_entropy_secs = 60

      [coordinator.global]
      url = "http://global:8080"
      token_env = "WARDEN_GLOBAL_TOKEN"
      push_secs = 5

      [[coordinator.provision]]
      zone = "us-west-1a"
      region = "us"
      token_env = "WARDEN_AGENT_TOKEN_W"

      [[coordinator.provision]]
      zone = "us-east-1a"
      region = "us"
      token_env = "WARDEN_AGENT_TOKEN_E"

  # ---- Taiwan coordinator: single node in region "tw". ----
  coordinator-tw-toml:
    content: |
      [coordinator]
      listen = "0.0.0.0:8080"
      db_path = "/data/warden.duckdb"
      node_id = "coordinator-tw"
      region = "tw"

      [coordinator.rollup_defaults]
      min_incident_secs = 60

      [coordinator.global]
      url = "http://global:8080"
      token_env = "WARDEN_GLOBAL_TOKEN"
      push_secs = 5

      [[coordinator.provision]]
      zone = "tw-north-1a"
      region = "tw"
      token_env = "WARDEN_AGENT_TOKEN_TW"

      # Checks are created through the Admin UI or API and persisted in the
      # database; none are seeded from this file.

  # ---- Global node: caches both regions, seeded with their endpoints so
  #      drill-down proxying works before the first push and after a restart. ----
  global-toml:
    content: |
      [global]
      listen = "0.0.0.0:8080"
      token_env = "WARDEN_GLOBAL_TOKEN"
      region_staleness_secs = 20

      [[global.region]]
      name = "us"
      endpoints = [
        "http://coordinator-us-a:8080",
        "http://coordinator-us-b:8080",
        "http://coordinator-us-c:8080",
      ]

      [[global.region]]
      name = "tw"
      endpoints = ["http://coordinator-tw:8080"]

  # ---- Agents. Each region's agents fail over across that region's
  #      coordinators; the tw agent has only one. ----
  agent-us-1-toml:
    content: |
      [agent]
      coordinator_url = ["http://coordinator-us-a:8080", "http://coordinator-us-b:8080", "http://coordinator-us-c:8080"]
      agent_id = "agent-us-1"
      flush_secs = 5

  agent-us-2-toml:
    content: |
      [agent]
      coordinator_url = ["http://coordinator-us-b:8080", "http://coordinator-us-c:8080", "http://coordinator-us-a:8080"]
      agent_id = "agent-us-2"
      flush_secs = 5

  agent-us-3-toml:
    content: |
      [agent]
      coordinator_url = ["http://coordinator-us-c:8080", "http://coordinator-us-a:8080", "http://coordinator-us-b:8080"]
      agent_id = "agent-us-3"
      flush_secs = 5

  agent-tw-toml:
    content: |
      [agent]
      coordinator_url = ["http://coordinator-tw:8080"]
      agent_id = "agent-tw"
      flush_secs = 5

volumes:
  coordinator-us-a-data:
  coordinator-us-b-data:
  coordinator-us-c-data:
  coordinator-tw-data:

networks:
  warden:
