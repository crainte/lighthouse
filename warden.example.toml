# Warden standalone config example.
# Run: warden standalone --config warden.example.toml
#
# The [[checks]] below seed the store on first boot. After that the store is
# authoritative: checks are created and edited in the admin UI, and editing this
# file will not change a check that already exists. With no checks anywhere the
# coordinator seeds demo data so the dashboard has something to show.

[agent]
agent_id = "local-01"
flush_secs = 5

[coordinator]
listen = "0.0.0.0:8080"
db_path = "warden.duckdb"
# Notification backends. Every notifier receives every alert.
# [[coordinator.notifiers]]
# type = "webhook"
# url = "https://hooks.slack.com/services/..."

# Secrets are better supplied by the environment than written here — this file
# tends to end up in version control. Both fall back to an env var:
#
#   WARDEN_ADMIN_PASSWORD  unlocks the check editor. With neither this nor the
#                          env var set, the editor is disabled rather than open.
#   WARDEN_PEER_TOKEN      coordinator-to-coordinator gossip. Only needed when
#                          `peers` is set. Unset means gossip is refused.
#
# Agents are not authenticated by anything in this file. Each zone gets a
# credential minted in Admin > Credentials, and a coordinator with none refuses
# every agent request until one exists — there is no shared token and no open
# mode.
#
# admin_password = "change-me"

# --- HTTP -------------------------------------------------------------------
# Default eval: any 2xx-3xx is UP.
[[checks]]
name = "example-http"
type = "http"
target = "https://example.com"
interval_secs = 30
timeout_secs = 10

# Assert an exact status code and a body substring. Useful when "200 OK" isn't
# enough — a page that returns 200 while printing "database error" is DOWN.
[[checks]]
name = "api-health"
type = "http"
target = "https://api.example.com/health"
interval_secs = 30
timeout_secs = 10
[checks.expect]
status = 200
body_contains = "ok"

# An endpoint that is *supposed* to reject you: expect 401, so a 200 is DOWN.
[[checks]]
name = "api-auth-required"
type = "http"
target = "https://api.example.com/private"
interval_secs = 60
timeout_secs = 10
[checks.expect]
status = 401

# --- TCP --------------------------------------------------------------------
# Connection success + latency. Target is "host:port".
[[checks]]
name = "database"
type = "tcp"
target = "db.internal:5432"
interval_secs = 60
timeout_secs = 5

# --- DNS --------------------------------------------------------------------
# Resolution success. The name is queried as a FQDN, so a resolver `search`
# domain can never silently answer for a different name.
#
# Robustness: caching is disabled (a probe must never report a stale success),
# a dropped UDP packet is retried (2 retries, 3 sends total) instead of counting
# as an outage, and UDP falls back to TCP on error. NXDOMAIN is a real answer and
# is deliberately not retried — it reports DOWN.
[[checks]]
name = "dns-example"
type = "dns"
target = "example.com"
interval_secs = 60
timeout_secs = 10

# Assert the record still points where you expect.
[[checks]]
name = "dns-record-pinned"
type = "dns"
target = "one.one.one.one"
interval_secs = 60
timeout_secs = 10
[checks.expect]
body_contains = "1.1.1.1"

# --- ICMP -------------------------------------------------------------------
# Ping success + RTT. Requires CAP_NET_RAW, or a permissive
# net.ipv4.ping_group_range sysctl. Without it the check reports a permission
# error rather than silently passing.
#
# Docker: docker run --cap-add=NET_RAW ...
[[checks]]
name = "gateway"
type = "icmp"
target = "1.1.1.1"
interval_secs = 60
timeout_secs = 5
