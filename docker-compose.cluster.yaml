# Stage A regional demo: three peer coordinators and three agents in us-east.
# Required: LIGHTHOUSE_PEER_TOKEN, LIGHTHOUSE_AGENT_TOKEN_A, LIGHTHOUSE_AGENT_TOKEN_B.
# Tokens have no committed defaults; A is shared by the two us-east-1a agents.
#
# Demo matrix:
#   UI / coordinator   agent       credential zone   region
#   :9001 / a          agent-a1    us-east-1a       us-east
#   :9002 / b          agent-a2    us-east-1a       us-east
#   :9003 / c          agent-b1    us-east-1b       us-east
# Seeds form the discovery chain a -> b -> c -> a. This is regional Stage A
# only: no trans-world or global coordinator is included.

name: lighthouse-cluster

x-coordinator: &coordinator
  build:
    context: .
    args:
      GIT_SHA: ${GIT_SHA:-}
  image: lighthouse:latest
  command: ["coordinator"]
  environment:
    LIGHTHOUSE_ADMIN_PASSWORD: ${LIGHTHOUSE_ADMIN_PASSWORD:-}
    LIGHTHOUSE_PEER_TOKEN: ${LIGHTHOUSE_PEER_TOKEN:?LIGHTHOUSE_PEER_TOKEN is required}
    LIGHTHOUSE_AGENT_TOKEN_A: ${LIGHTHOUSE_AGENT_TOKEN_A:?LIGHTHOUSE_AGENT_TOKEN_A is required}
    LIGHTHOUSE_AGENT_TOKEN_B: ${LIGHTHOUSE_AGENT_TOKEN_B:?LIGHTHOUSE_AGENT_TOKEN_B is required}
  restart: unless-stopped
  networks:
    - lighthouse

x-agent: &agent
  build:
    context: .
    args:
      GIT_SHA: ${GIT_SHA:-}
  image: lighthouse:latest
  command: ["agent"]
  cap_add:
    - NET_RAW
  restart: unless-stopped
  networks:
    - lighthouse

services:
  coordinator-a:
    <<: *coordinator
    ports:
      - "${LIGHTHOUSE_PORT_USE_A:-9001}:8080"
    configs:
      - source: coordinator-a-toml
        target: /data/lighthouse.toml
    volumes:
      - coordinator-a-data:/data

  coordinator-b:
    <<: *coordinator
    ports:
      - "${LIGHTHOUSE_PORT_USE_B:-9002}:8080"
    configs:
      - source: coordinator-b-toml
        target: /data/lighthouse.toml
    volumes:
      - coordinator-b-data:/data

  coordinator-c:
    <<: *coordinator
    ports:
      - "${LIGHTHOUSE_PORT_USE_C:-9003}:8080"
    configs:
      - source: coordinator-c-toml
        target: /data/lighthouse.toml
    volumes:
      - coordinator-c-data:/data

  agent-a1:
    <<: *agent
    environment:
      LIGHTHOUSE_AGENT_TOKEN: ${LIGHTHOUSE_AGENT_TOKEN_A:?LIGHTHOUSE_AGENT_TOKEN_A is required}
    configs:
      - source: agent-a1-toml
        target: /data/lighthouse.toml

  agent-a2:
    <<: *agent
    environment:
      LIGHTHOUSE_AGENT_TOKEN: ${LIGHTHOUSE_AGENT_TOKEN_A:?LIGHTHOUSE_AGENT_TOKEN_A is required}
    configs:
      - source: agent-a2-toml
        target: /data/lighthouse.toml

  agent-b1:
    <<: *agent
    environment:
      LIGHTHOUSE_AGENT_TOKEN: ${LIGHTHOUSE_AGENT_TOKEN_B:?LIGHTHOUSE_AGENT_TOKEN_B is required}
    configs:
      - source: agent-b1-toml
        target: /data/lighthouse.toml

configs:
  coordinator-a-toml:
    content: |
      [coordinator]
      listen = "0.0.0.0:8080"
      db_path = "/data/lighthouse.duckdb"
      node_id = "coordinator-a"
      advertise_url = "http://coordinator-a:8080"
      peers = ["http://coordinator-b:8080"]
      gossip_interval_secs = 5
      peer_timeout_secs = 15
      anti_entropy_secs = 60

      [[coordinator.provision]]
      zone = "us-east-1a"
      region = "us-east"
      token_env = "LIGHTHOUSE_AGENT_TOKEN_A"

      [[coordinator.provision]]
      zone = "us-east-1b"
      region = "us-east"
      token_env = "LIGHTHOUSE_AGENT_TOKEN_B"

      # Checks are created through the Admin UI or API and persisted in the
      # database; none are seeded from this file. Coordinator-b and -c receive
      # them over the config plane once created.

  coordinator-b-toml:
    content: |
      [coordinator]
      listen = "0.0.0.0:8080"
      db_path = "/data/lighthouse.duckdb"
      node_id = "coordinator-b"
      advertise_url = "http://coordinator-b:8080"
      peers = ["http://coordinator-c:8080"]
      gossip_interval_secs = 5
      peer_timeout_secs = 15
      anti_entropy_secs = 60

      [[coordinator.provision]]
      zone = "us-east-1a"
      region = "us-east"
      token_env = "LIGHTHOUSE_AGENT_TOKEN_A"

      [[coordinator.provision]]
      zone = "us-east-1b"
      region = "us-east"
      token_env = "LIGHTHOUSE_AGENT_TOKEN_B"

  coordinator-c-toml:
    content: |
      [coordinator]
      listen = "0.0.0.0:8080"
      db_path = "/data/lighthouse.duckdb"
      node_id = "coordinator-c"
      advertise_url = "http://coordinator-c:8080"
      peers = ["http://coordinator-a:8080"]
      gossip_interval_secs = 5
      peer_timeout_secs = 15
      anti_entropy_secs = 60

      [[coordinator.provision]]
      zone = "us-east-1a"
      region = "us-east"
      token_env = "LIGHTHOUSE_AGENT_TOKEN_A"

      [[coordinator.provision]]
      zone = "us-east-1b"
      region = "us-east"
      token_env = "LIGHTHOUSE_AGENT_TOKEN_B"

  agent-a1-toml:
    content: |
      [agent]
      # Failover, not sharding. Every coordinator in the region serves every
      # agent in it, so losing one must not silently stop this agent's probes.
      # The preferred entry is first; there is no failback.
      coordinator_url = ["http://coordinator-a:8080", "http://coordinator-b:8080", "http://coordinator-c:8080"]
      agent_id = "agent-a1"
      flush_secs = 5

  agent-a2-toml:
    content: |
      [agent]
      # Failover, not sharding. Every coordinator in the region serves every
      # agent in it, so losing one must not silently stop this agent's probes.
      # The preferred entry is first; there is no failback.
      coordinator_url = ["http://coordinator-b:8080", "http://coordinator-c:8080", "http://coordinator-a:8080"]
      agent_id = "agent-a2"
      flush_secs = 5

  agent-b1-toml:
    content: |
      [agent]
      # Failover, not sharding. Every coordinator in the region serves every
      # agent in it, so losing one must not silently stop this agent's probes.
      # The preferred entry is first; there is no failback.
      coordinator_url = ["http://coordinator-c:8080", "http://coordinator-a:8080", "http://coordinator-b:8080"]
      agent_id = "agent-b1"
      flush_secs = 5

volumes:
  coordinator-a-data:
  coordinator-b-data:
  coordinator-c-data:

networks:
  lighthouse: