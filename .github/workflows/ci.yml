name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    # Trusted events (push, release) may use self-hosted runners via the RUNNER
    # repo variable. Pull requests, including forks, always use GitHub-hosted.
    runs-on: ${{ github.event_name != 'pull_request' && vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      # The ARC runner image (ghcr.io/actions/actions-runner) ships no C
      # toolchain, and rustc needs `cc` to link. No-op on GitHub-hosted.
      - name: Ensure a C linker
        run: |
          command -v cc >/dev/null && exit 0
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: env -u LIGHTHOUSE_AGENT_TOKEN cargo test --locked

  frontend:
    name: Frontend
    runs-on: ${{ github.event_name != 'pull_request' && vars.RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npx svelte-check --threshold error
      - run: npx vitest run
      - run: bun run build

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  image:
    name: Docker build
    runs-on: ${{ github.event_name != 'pull_request' && vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: GIT_SHA=${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
