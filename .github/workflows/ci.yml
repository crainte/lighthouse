name: CI

# One job per gate so a failure names its cause. Every job runs a single step
# from hk.pkl (`hk check --all --slow -S <step>`), which is the one definition
# of what each gate does; run the same command locally to reproduce a failure.
# Tool versions come from mise.toml and the Rust toolchain from
# rust-toolchain.toml. The backup/restore smoke test is deliberately not run here.
# Pushes to main run this via release.yml (workflow_call), not a push trigger,
# so each main commit gets exactly one CI run.
on:
  pull_request:
  workflow_call:
    inputs:
      docker:
        description: "Run docker-build. release.yml disables it when a release is pending, since publish builds the image."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: jdx/mise-action@v4
      - run: hk check --all --slow -S fmt

  clippy:
    name: clippy
    # Trusted events (push, release) may use self-hosted runners via the RUNNER
    # repo variable. Pull requests, including forks, always use GitHub-hosted.
    runs-on: ${{ github.event_name != 'pull_request' && vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      # The ARC runner image (ghcr.io/actions/actions-runner) ships no C
      # toolchain, and rustc needs `cc` to link. No-op on GitHub-hosted.
      - name: Ensure a C linker
        run: |
          command -v cc >/dev/null && exit 0
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends build-essential
      - run: rustup toolchain install
      - uses: kunobi-ninja/kache-action@v1
        with:
          # Keep the read-only CI permissions; cache stats belong in logs/job summary.
          pr-comment: false
      - uses: jdx/mise-action@v4
      # rust-embed needs frontend/dist at compile time.
      - run: bun install --frozen-lockfile && bun run build
        working-directory: frontend
      - run: hk check --all --slow -S clippy

  test:
    name: test
    runs-on: ${{ github.event_name != 'pull_request' && vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - name: Ensure a C linker
        run: |
          command -v cc >/dev/null && exit 0
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends build-essential
      - run: rustup toolchain install
      - uses: kunobi-ninja/kache-action@v1
        with:
          # Keep the read-only CI permissions; cache stats belong in logs/job summary.
          pr-comment: false
      - uses: jdx/mise-action@v4
      # rust-embed needs frontend/dist at compile time.
      - run: bun install --frozen-lockfile && bun run build
        working-directory: frontend
      - run: hk check --all --slow -S test

  svelte-check:
    name: svelte-check
    runs-on: ${{ github.event_name != 'pull_request' && vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: hk check --all --slow -S svelte-check

  vitest:
    name: vitest
    runs-on: ${{ github.event_name != 'pull_request' && vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: hk check --all --slow -S vitest

  frontend-build:
    name: frontend-build
    runs-on: ${{ github.event_name != 'pull_request' && vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: hk check --all --slow -S frontend-build

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@cargo-audit
      - uses: jdx/mise-action@v4
      - run: hk check --all --slow -S cargo-audit

  cargo-machete:
    name: cargo-machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: jdx/mise-action@v4
      - run: hk check --all --slow -S cargo-machete

  bun-audit:
    name: bun-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: hk check --all --slow -S bun-audit

  docker-build:
    name: docker-build
    if: github.event_name == 'pull_request' || inputs.docker
    runs-on: ${{ github.event_name != 'pull_request' && vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: docker/setup-buildx-action@v4
      # Exposes the Actions cache credentials to the shell so the `docker
      # buildx build` in hk.pkl can use type=gha, the same cache release.yml's
      # publish job reads.
      - uses: crazy-max/ghaction-github-runtime@v4
      - run: hk check --all --slow -S docker-build
        env:
          DOCKER_BUILD_FLAGS: --cache-from type=gha,scope=lighthouse --cache-to type=gha,mode=max,scope=lighthouse

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: hk check --all --slow -S actionlint
