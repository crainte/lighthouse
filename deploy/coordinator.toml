# Coordinator: serves the dashboard and ingests agent results. Runs NO checks.
#
# The [[checks]] below are a *seed*. They populate the store on first boot
# against an empty volume; after that the store is authoritative, checks are
# created and edited in the admin UI, and agents pull the list from here rather
# than carrying their own copy. Editing this file does not change a check that
# already exists.
#
# Secrets come from the environment, never from this file:
#   WARDEN_ADMIN_PASSWORD  unlocks the check editor (unset = editor disabled)
#   WARDEN_PEER_TOKEN      coordinator-to-coordinator auth for membership and
#                          replication; only needed once `peers` below is set
#   WARDEN_ADVERTISE_URL   this node's own address, same condition
#
# Agents are NOT authenticated by anything here. Each zone gets a credential
# minted in Admin > Credentials, and a coordinator with none refuses every agent
# request until one exists.
#
# This file is shared by the single-node compose stack (docker-compose.yaml),
# so the cluster block below stays commented out here — `peers` empty is what
# keeps that stack standalone. docker-compose.cluster.yaml carries its own,
# uncommented, three-node version of it inline.

[coordinator]
listen = "0.0.0.0:8080"
db_path = "/data/warden.duckdb"
# Notification backends. Each has a `name`, which is what a check routes to.
# `default = true` means it also receives every check that names no notifier at
# all; a check with `notify = false` reaches nobody either way.
#
# Also a seed: this list applies on first boot only, and after that
# Admin > Notifications owns it, including a test-send button. Editing this
# block on a store that already has the list changes nothing.
#
# [[coordinator.notifiers]]
# name = "oncall"
# type = "webhook"
# url = "https://hooks.slack.com/services/..."
#
# [[coordinator.notifiers]]
# name = "database-team"
# type = "ntfy"
# topic = "warden-db"
# default = false      # only checks that name it
#
# Regional clustering — this coordinator as coordinator-a in a three-node HA
# region, cross-linked with coordinator-b and coordinator-c. `peers` is a seed
# list, not the membership: one reachable seed is enough to join and learn the
# rest transitively, so a peer that is down at boot costs nothing once the
# cluster has formed. See §9 Clustering in uptime-monitor-design.md.
#
# peers = ["http://coordinator-b:8080", "http://coordinator-c:8080"]
#
# Stable identity of this node. Unset means one is generated on first boot and
# persisted in `settings`, so a restart rejoins as itself instead of appearing
# as a new member and leaving a ghost behind. Must be unique per node — it
# also breaks HLC ties on replicated config.
# node_id = "coordinator-a"
#
# How peers reach this node. Required once `peers` is non-empty: startup
# refuses to run without it, because a node no peer can dial back replicates
# outward while receiving nothing, which otherwise looks like a network
# problem for as long as it takes someone to read the *other* machine's logs.
# advertise_url = "http://coordinator-a:8080"
#
# How often every known member is pinged, and the granularity of failure
# detection — nothing is noticed faster than this.
# gossip_interval_secs = 5
#
# Silence past this suspects a member; twice this declares it dead. Comfortably
# above gossip_interval_secs, or one dropped ping suspects a healthy peer.
# peer_timeout_secs = 15
#
# How often to reconcile with a peer by digest exchange. Bounds how long a
# divergence from a dropped replication push can last — a correctness
# backstop, not the main replication path.
# anti_entropy_secs = 60
#
# How many polls an agent may miss before it is treated as gone. The window is
# this times the agent's own poll_secs, so detection costs the same number of
# cycles at any cadence.
# missed_polls = 3
#
# How much an anonymous visitor is told about the fleet. Agent health is
# liveness, not check health: an agent that answers is healthy even if every
# check it probes is down. The per-agent list stays admin-only whatever is set
# here — this only chooses how it is summarised.
#
# Like [[checks]], this is a *seed*: it applies on first boot only, and after
# that Admin > Status page owns it. Editing this block on a store that already
# has the setting changes nothing. Keep it last — every key after the header
# belongs to it.
#
# [coordinator.status_page.agents]
# mode = "regions"        # "regions" | "flat" (names every agent) | "off"
# pinned = ["office-box"] # agent ids given a row of their own, in this order
# warn_below = 100.0      # % of a region's agents healthy for a green row
# down_below = 50.0       # below this the region row reads down

[[checks]]
name = "example-http"
type = "http"
target = "https://example.com"
latency_graph = true
interval_secs = 30
timeout_secs = 10
[checks.expect]
status = 200

[[checks]]
name = "cloudflare-dns"
type = "dns"
target = "one.one.one.one"
interval_secs = 30
timeout_secs = 10
[checks.expect]
body_contains = "1.1.1.1"

[[checks]]
name = "cloudflare-ping"
type = "icmp"
target = "1.1.1.1"
latency_graph = true
interval_secs = 30
timeout_secs = 5

[[checks]]
name = "coordinator-self"
type = "http"
target = "http://coordinator:8080/api/v1/status"
group = "Warden Internals"
interval_secs = 30
timeout_secs = 5

[[checks]]
name = "coordinator-port"
type = "tcp"
target = "coordinator:8080"
group = "Warden Internals"
interval_secs = 30
timeout_secs = 5
