# Agent A: runs checks, POSTs results to the coordinator. Serves no UI.
#
# `zone` and `region` say where this probe observes from. Nothing infers them —
# only the operator knows which rack, datacentre or AZ a process sits in — and
# results are meaningless without them once there is more than one vantage
# point: "the API is slow" and "the API is slow from Frankfurt" are different
# findings. They also drive placement, so a check scoped to a region is handed
# only to agents that declared it.

[agent]
coordinator_url = "http://coordinator:8080"
agent_id = "agent-a"
zone = "us-east-1a"
region = "us-east"
flush_secs = 5

# No [[checks]] here on purpose. The coordinator owns the check list and this
# agent pulls it from /api/v1/agent/checks at startup and every `poll_secs`, so
# a check added in the UI starts being probed without touching this file. Any
# checks listed here would only be a cold-start fallback before the first
# successful poll.
