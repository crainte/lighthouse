# Agent B: runs checks, POSTs results to the coordinator. Serves no UI.
#
# Location is NOT declared here. It comes from the credential in `token`, which
# the coordinator minted for one zone, because placement acts on location and an
# agent able to name its own zone could be handed checks it never runs. Set
# `token` from WARDEN_AGENT_TOKEN in the environment; the value is shown once,
# when the credential is generated in Admin > Credentials.

[agent]
coordinator_url = "http://coordinator:8080"
agent_id = "agent-b"
# Reported location comes from the credential: eu-west-1a / eu-west.
flush_secs = 5

# No [[checks]] here on purpose. The coordinator owns the check list and this
# agent pulls it from /api/v1/agent/checks at startup and every `poll_secs`, so
# a check added in the UI starts being probed without touching this file. Any
# checks listed here would only be a cold-start fallback before the first
# successful poll.
