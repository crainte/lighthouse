# Standalone Lighthouse: one process runs the coordinator and local agent.
# Open http://localhost:${LIGHTHOUSE_PORT:-9000}. Incidents must persist for 60s
# before publication, avoiding transient alerts in this single-observer setup.

name: lighthouse-standalone

services:
  lighthouse:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: lighthouse:latest
    command: ["standalone"]
    ports:
      - "${LIGHTHOUSE_PORT:-9000}:8080"
    environment:
      LIGHTHOUSE_ADMIN_PASSWORD: ${LIGHTHOUSE_ADMIN_PASSWORD:-}
    cap_add:
      - NET_RAW
    configs:
      - source: lighthouse-toml
        target: /data/lighthouse.toml
    volumes:
      - lighthouse-data:/data
    restart: unless-stopped
    networks:
      - lighthouse

configs:
  lighthouse-toml:
    content: |
      [agent]
      zone = "local"
      region = "local"
      agent_id = "local-01"

      [coordinator]
      listen = "0.0.0.0:8080"
      db_path = "/data/lighthouse.duckdb"

      [coordinator.rollup_defaults]
      min_incident_secs = 60

      # Checks are created through the Admin UI or API and persisted in the
      # database; none are seeded from this file.

volumes:
  lighthouse-data:

networks:
  lighthouse: