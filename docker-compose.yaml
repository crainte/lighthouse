# Core: the coordinator alone. Storage, evaluation, alerting and the dashboard.
#
#   docker compose up -d --build
#   open http://localhost:8082
#
# Agents live in docker-compose.agents.yaml and start *second*, because they
# cannot authenticate until a credential exists. There is no fleet-wide token
# and no open mode: a coordinator with no credentials refuses every agent
# request, which is the intended first-run state.
#
# First run, in order:
#
#   1. echo 'WARDEN_ADMIN_PASSWORD=...' >> .env
#   2. docker compose up -d --build
#   3. open http://localhost:8082 -> Admin -> Credentials, and generate one
#      credential per zone. Each is shown exactly once.
#   4. put them in .env as WARDEN_AGENT_TOKEN_A / _B (see the agents file)
#   5. docker compose -f docker-compose.agents.yaml up -d --build
#
# Secrets come from the environment so they stay out of the config files, which
# are committed. Docker compose reads .env automatically and .gitignore already
# covers it.
#
#   WARDEN_ADMIN_PASSWORD=...   unlocks the check editor; unset disables it
#   WARDEN_PEER_TOKEN=...       only needed when running multiple coordinators

services:
  coordinator:
    build: .
    image: warden:latest
    command: ["coordinator", "--config", "/etc/warden/coordinator.toml"]
    ports:
      # 8080 is often taken on the host (AdGuard here), so publish on 8082.
      - "8082:8080"
    environment:
      # Unset means the check editor stays locked rather than open — and with
      # it locked there is no way to mint an agent credential, so the fleet
      # cannot report either. Set this before anything else.
      WARDEN_ADMIN_PASSWORD: ${WARDEN_ADMIN_PASSWORD:-}
      # Peer-to-peer gossip only. Never an agent's credential: the endpoint
      # rewrites published state.
      WARDEN_PEER_TOKEN: ${WARDEN_PEER_TOKEN:-}
    volumes:
      - ./deploy/coordinator.toml:/etc/warden/coordinator.toml:ro
      - coordinator-data:/data
    restart: unless-stopped
    networks:
      - warden

volumes:
  coordinator-data:

# Named so the agents compose file can join it from a separate project.
networks:
  warden:
    name: warden
