# Standalone Warden: one process runs the coordinator and local agent.
# Open http://localhost:${WARDEN_PORT:-9000}. Incidents must persist for 60s
# before publication, avoiding transient alerts in this single-observer setup.

name: warden-standalone

services:
  warden:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: warden:latest
    command: ["standalone"]
    ports:
      - "${WARDEN_PORT:-9000}:8080"
    environment:
      WARDEN_ADMIN_PASSWORD: ${WARDEN_ADMIN_PASSWORD:-}
    cap_add:
      - NET_RAW
    configs:
      - source: warden-toml
        target: /data/warden.toml
    volumes:
      - warden-data:/data
    restart: unless-stopped
    networks:
      - warden

configs:
  warden-toml:
    content: |
      [agent]
      zone = "local"
      region = "local"
      agent_id = "local-01"

      [coordinator]
      listen = "0.0.0.0:8080"
      db_path = "/data/warden.duckdb"

      [coordinator.rollup_defaults]
      min_incident_secs = 60

      # Checks are created through the Admin UI or API and persisted in the
      # database; none are seeded from this file.

volumes:
  warden-data:

networks:
  warden:
