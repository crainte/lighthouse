external-secrets:
  - name: lighthouse-admin-credentials
    spec:
      refreshInterval: 1h
      secretStoreRef:
        name:
          $ref: inputs.secretStore.name
        kind:
          $ref: inputs.secretStore.kind
      target:
        name: lighthouse-admin-credentials
        creationPolicy: Owner
        deletionPolicy: Retain
      data:
        - secretKey: LIGHTHOUSE_ADMIN_PASSWORD
          remoteRef:
            key:
              $ref: inputs.adminPasswordRemoteKey
  - name: lighthouse-coordinator-credentials
    spec:
      refreshInterval: 1h
      secretStoreRef:
        name:
          $ref: inputs.secretStore.name
        kind:
          $ref: inputs.secretStore.kind
      target:
        name: lighthouse-coordinator-credentials
        creationPolicy: Owner
        deletionPolicy: Retain
      data:
        - secretKey: LIGHTHOUSE_PEER_TOKEN
          remoteRef:
            key:
              $ref: inputs.coordinatorPeerTokenRemoteKey
        - secretKey: LIGHTHOUSE_REGION_KEY
          remoteRef:
            key:
              $ref: inputs.regionKeyRemoteKey
  - name: lighthouse-global-credentials
    spec:
      refreshInterval: 1h
      secretStoreRef:
        name:
          $ref: inputs.secretStore.name
        kind:
          $ref: inputs.secretStore.kind
      target:
        name: lighthouse-global-credentials
        creationPolicy: Owner
        deletionPolicy: Retain
      data:
        - secretKey: LIGHTHOUSE_PEER_TOKEN
          remoteRef:
            key:
              $ref: inputs.globalPeerTokenRemoteKey
  - name: lighthouse-agent-credentials
    spec:
      refreshInterval: 1h
      secretStoreRef:
        name:
          $ref: inputs.secretStore.name
        kind:
          $ref: inputs.secretStore.kind
      target:
        name: lighthouse-agent-credentials
        creationPolicy: Owner
        deletionPolicy: Retain
      data:
        - secretKey: LIGHTHOUSE_AGENT_TOKEN
          remoteRef:
            key:
              $ref: inputs.agentTokenRemoteKey
