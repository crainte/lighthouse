deployments:
  - name: lighthouse-agent
    dependsOn:
      - external-secrets/lighthouse-agent-credentials
    metadata:
      labels:
        app.kubernetes.io/name: lighthouse
        app.kubernetes.io/component: agent
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: lighthouse
          app.kubernetes.io/component: agent
      template:
        metadata:
          labels:
            app.kubernetes.io/name: lighthouse
            app.kubernetes.io/component: agent
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: lighthouse
              image: ghcr.io/crainte/lighthouse:0.4.3
              imagePullPolicy: IfNotPresent
              args: [agent, --config, /etc/lighthouse/lighthouse.toml]
              env:
                - name: LIGHTHOUSE_AGENT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: lighthouse-agent-credentials
                      key: LIGHTHOUSE_AGENT_TOKEN
              volumeMounts:
                - name: configmap-lighthouse-agent-config
                  mountPath: /etc/lighthouse/lighthouse.toml
                  subPath: lighthouse.toml
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
          volumes:
            - name: configmap-lighthouse-agent-config
              configMap:
                name: lighthouse-agent-config
