stateful-sets:
  - name: lighthouse-coordinator
    dependsOn:
      - external-secrets/lighthouse-coordinator-credentials
    metadata:
      labels:
        app.kubernetes.io/name: lighthouse
        app.kubernetes.io/component: coordinator
    spec:
      serviceName: lighthouse-coordinator-headless
      replicas:
        $ref: inputs.coordinatorReplicas
      podManagementPolicy: Parallel
      selector:
        matchLabels:
          app.kubernetes.io/name: lighthouse
          app.kubernetes.io/component: coordinator
      template:
        metadata:
          labels:
            app.kubernetes.io/name: lighthouse
            app.kubernetes.io/component: coordinator
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: lighthouse
                      app.kubernetes.io/component: coordinator
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: lighthouse
              image: ghcr.io/crainte/lighthouse:0.4.3
              imagePullPolicy: IfNotPresent
              args: [coordinator, --config, /etc/lighthouse/lighthouse.toml]
              ports:
                - name: http
                  containerPort: 8080
                  protocol: TCP
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: LIGHTHOUSE_NODE_ID
                  value: $(POD_NAME)
                - name: LIGHTHOUSE_ADVERTISE_URL
                  value: http://$(POD_NAME).lighthouse-coordinator-headless.$(POD_NAMESPACE).svc.cluster.local:8080
                - name: LIGHTHOUSE_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: lighthouse-admin-credentials
                      key: LIGHTHOUSE_ADMIN_PASSWORD
                      optional: true
                - name: LIGHTHOUSE_PEER_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: lighthouse-coordinator-credentials
                      key: LIGHTHOUSE_PEER_TOKEN
                - name: LIGHTHOUSE_REGION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: lighthouse-coordinator-credentials
                      key: LIGHTHOUSE_REGION_KEY
              volumeMounts:
                - name: configmap-lighthouse-coordinator-config
                  mountPath: /etc/lighthouse/lighthouse.toml
                  subPath: lighthouse.toml
                  readOnly: true
                - name: data
                  mountPath: /data
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              startupProbe:
                httpGet:
                  path: /api/v1/status
                  port: http
                periodSeconds: 5
                failureThreshold: 24
              livenessProbe:
                httpGet:
                  path: /api/v1/status
                  port: http
                periodSeconds: 15
                timeoutSeconds: 3
                failureThreshold: 4
              readinessProbe:
                httpGet:
                  path: /api/v1/status
                  port: http
                periodSeconds: 5
                timeoutSeconds: 3
                failureThreshold: 3
          volumes:
            - name: configmap-lighthouse-coordinator-config
              configMap:
                name: lighthouse-coordinator-config
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Retain
        whenScaled: Retain
      volumeClaimTemplates:
        - metadata:
            name: data
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage:
                  $ref: inputs.coordinatorStorageSize

